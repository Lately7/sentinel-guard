[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-guard"
version = "0.1.0"
description = "Real-time malware and web threat protection for Windows + Helium/Chromium"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
ui = ["watchdog>=4", "pystray>=0.19", "Pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
sentinel = "sentinel.__main__:main"

[tool.setuptools.packages.find]
where = ["agent"]

[tool.setuptools.package-data]
sentinel = ["rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["agent"]
