<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Sentinel Guard</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 320px; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; }
    header b { font-size: 14px; font-weight: 600; flex: 1; }
    .logo { width: 18px; height: 18px; border: 2px solid var(--muted); display: grid; place-items: center; }
    .logo i { width: 6px; height: 6px; background: var(--core); }
    section { margin: 0 12px 12px; padding: 14px; background: var(--card); }
    .page { display: flex; align-items: center; gap: 10px; }
    .state { font-size: 15px; font-weight: 600; }
    ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
    ul:empty { display: none; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .stats b { display: block; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .stats span { font-size: 11.5px; }
    footer { display: flex; align-items: center; gap: 4px; padding: 0 12px 12px 16px; font-size: 12px; }
    footer .agent { flex: 1; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
  </style>
</head>
<body>
  <header>
    <div class="logo"><i></i></div><b>Sentinel Guard</b>
    <label class="switch" title="Bảo vệ web"><input type="checkbox" id="enabled"><span></span></label>
  </header>
  <section>
    <div class="page"><span class="mark" id="page-mark"></span><span id="page" class="state">—</span></div>
    <ul id="reasons"></ul>
  </section>
  <section class="stats">
    <div><b id="s-blocked">0</b><span class="muted">đã chặn</span></div>
    <div><b id="s-warned">0</b><span class="muted">cảnh báo</span></div>
    <div><b id="s-downloads">0</b><span class="muted">tệp đã quét</span></div>
  </section>
  <footer>
    <div class="agent muted" title="Agent trên máy và danh sách chặn">
      <span class="mark" id="agent-mark"></span><span id="agent">—</span><span>·</span><span id="size">—</span>
    </div>
    <button class="quiet" id="sync">Đồng bộ</button>
    <button class="quiet" id="trust">Tin cậy</button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
